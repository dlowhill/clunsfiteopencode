<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cluns Fite</title>
    <style>
        * {
            user-select: none;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        /* СТАРТОВЫЙ ЭКРАН */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a1f 0%, #0a0f1e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .splash-content {
            text-align: center;
            animation: fadeInUp 1s ease;
        }
        .splash-title {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ffcc44;
            text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300;
            letter-spacing: 4px;
            margin-bottom: 16px;
        }
        .splash-subtitle {
            font-size: 1.2rem;
            color: #ffaa66;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        .splash-company {
            font-size: 0.9rem;
            color: #88aaff;
            margin-top: 40px;
            border-top: 1px solid #ffaa33;
            display: inline-block;
            padding-top: 12px;
            padding-left: 20px;
            padding-right: 20px;
        }
        .splash-loader {
            width: 40px;
            height: 40px;
            margin: 20px auto 0;
            border: 3px solid #ffaa33;
            border-top-color: #ff4400;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ОСНОВНЫЕ ЭКРАНЫ */
        .login-container, .menu-container, .game-container, .search-container, .result-container {
            background: #1a2a1f;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 3px solid #ffcc44;
            width: 380px;
        }
        h2, h3 {
            color: #ffec99;
            text-align: center;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2d3e2b;
            border: 2px solid #ffaa33;
            border-radius: 40px;
            color: #ffec99;
            font-family: monospace;
            font-size: 1rem;
            outline: none;
        }
        button {
            width: 100%;
            background: #5a3e1a;
            border: none;
            color: #ffdd99;
            font-family: monospace;
            font-weight: bold;
            padding: 12px;
            border-radius: 40px;
            font-size: 1.2rem;
            margin-top: 16px;
            box-shadow: 0 4px 0 #2a1e05;
            transition: 0.05s linear;
            cursor: pointer;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2a1e05;
        }
        .error {
            color: #ff8866;
            text-align: center;
            margin-top: 12px;
        }
        .hidden {
            display: none;
        }
        .stats {
            background: #000000aa;
            padding: 12px;
            border-radius: 20px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
        }
        .stat {
            text-align: center;
            color: #ffec99;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffaa33;
        }
        .arena-badge {
            background: #442200;
            padding: 8px;
            border-radius: 20px;
            text-align: center;
            margin: 12px 0;
            color: #ffcc88;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            background: #2d3e2b;
            box-shadow: inset 0 0 0 2px #ffcc88, 0 0 0 4px #442200;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .panel {
            background: #000000aa;
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 60px;
            color: #ffec99;
            font-weight: bold;
            font-size: 1.2rem;
            border: 1px solid #ffaa33;
        }
        .search-text {
            text-align: center;
            color: #ffcc88;
            font-size: 1.2rem;
            margin: 20px 0;
        }
        .timer {
            font-size: 2rem;
            text-align: center;
            color: #ffaa33;
        }
        .result-text {
            text-align: center;
            font-size: 1.5rem;
            margin: 20px 0;
        }
        .win-text { color: #88ff88; }
        .lose-text { color: #ff8888; }
    </style>
</head>
<body>

<!-- СТАРТОВЫЙ ЭКРАН -->
<div id="splashScreen" class="splash-screen">
    <div class="splash-content">
        <div class="splash-title">CLUNS FITE</div>
        <div class="splash-subtitle">⚔️ БИТВА КЛОУНОВ ⚔️</div>
        <div class="splash-loader"></div>
        <div class="splash-company">DlowHill</div>
    </div>
</div>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="login-container hidden">
    <h2>🤡 CLUNS FITE</h2>
    <input type="email" id="emailInput" placeholder="Почта">
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button id="loginBtn">ВОЙТИ</button>
    <div id="loginError" class="error"></div>
</div>

<!-- ЭКРАН МЕНЮ -->
<div id="menuScreen" class="menu-container hidden">
    <h2>🤡 CLUNS FITE</h2>
    <div class="stats">
        <div class="stat">
            <div>🏆 ПОБЕДЫ</div>
            <div class="stat-value" id="winsValue">0</div>
        </div>
        <div class="stat">
            <div>🎪 АРЕНА</div>
            <div class="stat-value" id="arenaValue">1</div>
        </div>
    </div>
    <div class="arena-badge" id="arenaName">⚔️ НАЧАЛЬНАЯ АРЕНА</div>
    <button id="playBtn">🔍 ИГРАТЬ</button>
    <button id="menuLogoutBtn" style="background:#4a2a1a; margin-top:8px;">🚪 ВЫЙТИ</button>
</div>

<!-- ЭКРАН ПОИСКА -->
<div id="searchScreen" class="search-container hidden">
    <h3>🔍 ПОИСК СОПЕРНИКА...</h3>
    <div class="search-text">Cluns Fite</div>
    <div class="timer" id="searchTimer">5</div>
    <div class="search-text">⬅️ Ожидание...</div>
</div>

<!-- ЭКРАН РЕЗУЛЬТАТА (победа/поражение) -->
<div id="resultScreen" class="result-container hidden">
    <h2 id="resultTitle">РЕЗУЛЬТАТ</h2>
    <div class="result-text" id="resultMessage"></div>
    <button id="resultOkBtn">В МЕНЮ</button>
</div>

<!-- ЭКРАН ИГРЫ -->
<div id="gameScreen" class="game-container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <div class="panel" style="padding: 4px 12px;">👤 <span id="userEmailDisplay"></span></div>
        <button id="gameExitBtn" style="width:auto; padding:6px 12px; font-size:0.8rem;">🏠 МЕНЮ</button>
    </div>
    <canvas id="gameCanvas" width="380" height="500"></canvas>
    <div class="info">
        <div class="panel">❤️ ЖИЗНИ: <span id="hpValue">3</span></div>
        <div class="panel">🤡 СЧЁТ: <span id="scoreValue">0</span></div>
    </div>
    <div class="info badge">
        <div class="panel">🔫 ТЫКАЙ ПО ВРАГАМ</div>
        <div class="panel">🤡 ИГРОК vs БОТ</div>
    </div>
</div>

<script>
    // ========== СТАРТОВЫЙ ЭКРАН ==========
    const splashScreen = document.getElementById('splashScreen');
    
    // ========== ОСНОВНАЯ ЛОГИКА ==========
    const VALID_EMAIL = "dlow@cluns.com";
    const VALID_PASSWORD = "cluns123";
    
    let playerWins = 0;
    let playerArena = 1;
    let currentUserEmail = '';
    let currentGame = null;
    let gameInitialized = false;
    let searchInterval = null;
    let currentMatchResult = null; // 'win' или 'lose'
    
    // Элементы
    const loginScreen = document.getElementById('loginScreen');
    const menuScreen = document.getElementById('menuScreen');
    const searchScreen = document.getElementById('searchScreen');
    const gameScreen = document.getElementById('gameScreen');
    const resultScreen = document.getElementById('resultScreen');
    
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const menuLogoutBtn = document.getElementById('menuLogoutBtn');
    const gameExitBtn = document.getElementById('gameExitBtn');
    const playBtn = document.getElementById('playBtn');
    const resultOkBtn = document.getElementById('resultOkBtn');
    const resultMessage = document.getElementById('resultMessage');
    const resultTitle = document.getElementById('resultTitle');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const winsSpan = document.getElementById('winsValue');
    const arenaSpan = document.getElementById('arenaValue');
    const arenaNameSpan = document.getElementById('arenaName');
    const searchTimerSpan = document.getElementById('searchTimer');
    
    function updateMenuStats() {
        winsSpan.innerText = playerWins;
        arenaSpan.innerText = playerArena;
        if (playerArena === 1) arenaNameSpan.innerText = '⚔️ НАЧАЛЬНАЯ АРЕНА';
        else if (playerArena === 2) arenaNameSpan.innerText = '🎪 ЦИРКОВАЯ АРЕНА';
        else arenaNameSpan.innerText = '🤡 БЕЗУМНАЯ АРЕНА';
    }
    
    function addWin() {
        playerWins++;
        updateArenaByWins();
        localStorage.setItem('cluns_wins', playerWins);
        localStorage.setItem('cluns_arena', playerArena);
        updateMenuStats();
    }
    
    function removeWin() {
        playerWins--;
        updateArenaByWins();
        localStorage.setItem('cluns_wins', playerWins);
        localStorage.setItem('cluns_arena', playerArena);
        updateMenuStats();
    }
    
    function updateArenaByWins() {
        if (playerWins >= 15) playerArena = 3;
        else if (playerWins >= 5) playerArena = 2;
        else playerArena = 1;
    }
    
    function showLogin() {
        loginScreen.classList.remove('hidden');
        menuScreen.classList.add('hidden');
        searchScreen.classList.add('hidden');
        gameScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        if (searchInterval) clearInterval(searchInterval);
    }
    
    function showMenu() {
        if (currentGame && typeof currentGame.destroy === 'function') {
            currentGame.destroy();
        }
        gameInitialized = false;
        loginScreen.classList.add('hidden');
        searchScreen.classList.add('hidden');
        gameScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
        updateMenuStats();
        if (searchInterval) clearInterval(searchInterval);
    }
    
    function showSearch() {
        menuScreen.classList.add('hidden');
        searchScreen.classList.remove('hidden');
        let timer = 5;
        searchTimerSpan.innerText = timer;
        if (searchInterval) clearInterval(searchInterval);
        searchInterval = setInterval(() => {
            timer--;
            searchTimerSpan.innerText = timer;
            if (timer <= 0) {
                clearInterval(searchInterval);
                searchInterval = null;
                startGame();
            }
        }, 1000);
    }
    
    function startGame() {
        searchScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        if (!gameInitialized) {
            initGameSystem();
        } else {
            if (currentGame && typeof currentGame.reset === 'function') {
                currentGame.reset();
            }
        }
    }
    
    function showResult(isWin) {
        if (currentGame && typeof currentGame.destroy === 'function') {
            currentGame.destroy();
        }
        gameInitialized = false;
        gameScreen.classList.add('hidden');
        
        if (isWin) {
            resultTitle.innerText = '🏆 ПОБЕДА! 🏆';
            resultMessage.innerText = '+1 ПОБЕДА';
            resultMessage.className = 'result-text win-text';
            addWin();
        } else {
            resultTitle.innerText = '💀 ПОРАЖЕНИЕ 💀';
            resultMessage.innerText = '-1 ПОБЕДА';
            resultMessage.className = 'result-text lose-text';
            removeWin();
        }
        resultScreen.classList.remove('hidden');
    }
    
    function logout() {
        localStorage.removeItem('cluns_logged_in');
        localStorage.removeItem('cluns_user_email');
        localStorage.removeItem('cluns_wins');
        localStorage.removeItem('cluns_arena');
        playerWins = 0;
        playerArena = 1;
        showLogin();
    }
    
    // ========== ИГРОВАЯ СИСТЕМА (ОБЛЕГЧЕННАЯ ВЕРСИЯ) ==========
    function initGameSystem() {
        gameInitialized = true;
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        const CW = 380, CH = 500;
        
        // ИГРОК — сильнее, легче выиграть
        let player = { x: CW/2, y: CH-70, radius: 18, hp: 5, invincible: 0 }; // больше HP
        let score = 0;
        let gameOverFlag = false;
        let enemies = [];
        let spawnCounter = 0;
        let mouseX = player.x, mouseY = player.y;
        let animationId = null;
        
        function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
        
        function spawnEnemy() {
            if (gameOverFlag) return;
            let radius = 10 + Math.random() * 6; // меньше враги
            enemies.push({
                x: 20 + Math.random() * (CW-40), y: -radius, radius: radius,
                speed: 0.5 + Math.random() * 1.0, // медленнее
                hp: 1,
                color: `hsl(${Math.random()*60+20}, 70%, 55%)`, damage: 1, points: 10
            });
        }
        
        function updateGame() {
            if (gameOverFlag) return;
            player.x = clamp(mouseX, player.radius+5, CW-player.radius-5);
            player.y = clamp(mouseY, player.radius+20, CH-player.radius-10);
            if (player.invincible > 0) player.invincible--;
            for (let i=0; i<enemies.length; i++) {
                let e = enemies[i];
                e.y += e.speed;
                let dx = player.x - e.x, dy = player.y - e.y;
                let dist = Math.hypot(dx, dy);
                let minDist = player.radius + e.radius;
                if (dist < minDist && player.invincible===0 && !gameOverFlag) {
                    player.hp -= e.damage;
                    player.invincible = 15;
                    if (player.hp <= 0) {
                        player.hp = 0;
                        gameOverFlag = true;
                    }
                    if (minDist>0) {
                        let angle = Math.atan2(dy, dx);
                        let overlap = minDist - dist;
                        e.x -= Math.cos(angle)*overlap;
                        e.y -= Math.sin(angle)*overlap;
                    }
                }
            }
            enemies = enemies.filter(e => e.y+e.radius < CH+50 && e.y+e.radius > -50 && e.hp>0);
            spawnCounter++;
            if (spawnCounter >= 35 && !gameOverFlag) { // реже спавн
                spawnCounter = 0;
                let howMany = Math.min(1, 1+Math.floor(Math.random()*2));
                for(let i=0;i<howMany;i++) spawnEnemy();
            }
            if (score>30 && Math.random()<0.01 && !gameOverFlag) spawnEnemy();
        }
        
        function handleTap(e) {
            if (gameOverFlag) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
            let tapX, tapY;
            if (e.touches) {
                let touch = e.touches[0];
                tapX = (touch.clientX - rect.left)*scaleX;
                tapY = (touch.clientY - rect.top)*scaleY;
                e.preventDefault();
            } else {
                tapX = (e.clientX - rect.left)*scaleX;
                tapY = (e.clientY - rect.top)*scaleY;
            }
            for(let i=enemies.length-1; i>=0; i--) {
                let e = enemies[i];
                if (Math.hypot(tapX-e.x, tapY-e.y) < e.radius+15) { // легче попасть
                    enemies.splice(i,1);
                    score += 10;
                    break;
                }
            }
        }
        
        function updatePointer(e) {
            if (gameOverFlag) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left)*scaleX;
            let canvasY = (clientY - rect.top)*scaleY;
            mouseX = clamp(canvasX, 8, CW-8);
            mouseY = clamp(canvasY, 40, CH-20);
        }
        
        function checkWinCondition() {
            // Победа если набрал 50 очков
            if (score >= 50 && !gameOverFlag) {
                gameOverFlag = true;
                showResult(true);
            }
        }
        
        function resetGame() {
            gameOverFlag = false;
            player.hp = 5;
            player.invincible = 0;
            score = 0;
            enemies = [];
            player.x = CW/2;
            player.y = CH-70;
            mouseX = player.x;
            mouseY = player.y;
            spawnCounter = 5;
            for(let i=0;i<1;i++) spawnEnemy();
        }
        
        function draw() {
            ctx.clearRect(0,0,CW,CH);
            // Весёлый фон для лёгкой битвы
            ctx.fillStyle = "#4a8c3f";
            ctx.fillRect(0,0,CW,CH);
            for(let i=0;i<40;i++) {
                ctx.fillStyle = `rgba(255,220,100,${Math.random()*0.2})`;
                ctx.fillRect(Math.random()*CW, Math.random()*CH, 3+Math.random()*6, 3+Math.random()*6);
            }
            for(let e of enemies) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
                ctx.fillStyle = e.color;
                ctx.fill();
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#FFF";
                ctx.beginPath();
                ctx.arc(e.x-e.radius*0.3, e.y-e.radius*0.2, e.radius*0.2,0,Math.PI*2);
                ctx.arc(e.x+e.radius*0.3, e.y-e.radius*0.2, e.radius*0.2,0,Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(e.x-e.radius*0.3, e.y-e.radius*0.25, e.radius*0.08,0,Math.PI*2);
                ctx.arc(e.x+e.radius*0.3, e.y-e.radius*0.25, e.radius*0.08,0,Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x, e.y+e.radius*0.2, e.radius*0.4,0.05,Math.PI-0.05);
                ctx.strokeStyle = "#600";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
            ctx.save();
            if(player.invincible>0 && (Math.floor(Date.now()/60)%2===0)) ctx.globalAlpha=0.6;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius,0,Math.PI*2);
            ctx.fillStyle = "#ff77dd";
            ctx.fill();
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(player.x-6, player.y-4,4,0,Math.PI*2);
            ctx.arc(player.x+6, player.y-4,4,0,Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#310";
            ctx.beginPath();
            ctx.arc(player.x-6, player.y-5,2,0,Math.PI*2);
            ctx.arc(player.x+6, player.y-5,2,0,Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#a42";
            ctx.beginPath();
            ctx.ellipse(player.x, player.y+5,8,5,0,0,Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(player.x, player.y+2,4,0,Math.PI*2);
            ctx.fill();
            ctx.restore();
            
            // Отображение цели
            ctx.font = "bold 14monospace";
            ctx.fillStyle = "#FFDD88";
            ctx.fillText("ЦЕЛЬ: 50 ОЧКОВ", CW-100, 25);
            ctx.fillText("⭐ ПОБЕДА ЗАЩИТАНА ⭐", CW-140, 45);
            
            if(gameOverFlag && player.hp <= 0) {
                // Поражение
                showResult(false);
            }
            
            document.getElementById('hpValue').innerText = player.hp;
            document.getElementById('scoreValue').innerText = score;
            
            checkWinCondition();
        }
        
        function gameLoop() {
            updateGame();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function attachEvents() {
            canvas.addEventListener('mousemove', updatePointer);
            canvas.addEventListener('touchmove', updatePointer, {passive:false});
            canvas.addEventListener('touchstart', (e)=>{ updatePointer(e); handleTap(e); e.preventDefault();});
            canvas.addEventListener('mousedown', handleTap);
            canvas.addEventListener('click', (e)=>{ if(e.button===0) handleTap(e);});
        }
        
        function destroy() {
            if(animationId) cancelAnimationFrame(animationId);
            canvas.removeEventListener('mousemove', updatePointer);
            canvas.removeEventListener('touchmove', updatePointer);
            canvas.removeEventListener('touchstart', handleTap);
            canvas.removeEventListener('mousedown', handleTap);
        }
        
        resetGame();
        attachEvents();
        gameLoop();
        
        currentGame = { reset: resetGame, destroy: destroy };
    }
    
    // ========== ЗАГРУЗКА СОХРАНЕНИЙ ==========
    let isLoggedIn = localStorage.getItem('cluns_logged_in') === 'true';
    let savedWins = localStorage.getItem('cluns_wins');
    let savedArena = localStorage.getItem('cluns_arena');
    
    if (savedWins) playerWins = parseInt(savedWins);
    if (savedArena) playerArena = parseInt(savedArena);
    
    function showGameAfterLogin(email) {
        currentUserEmail = email;
        localStorage.setItem('cluns_logged_in', 'true');
        localStorage.setItem('cluns_user_email', email);
        userEmailDisplay.innerText = email.split('@')[0];
        showMenu();
    }
    
    loginBtn.onclick = () => {
        let email = emailInput.value.trim();
        let pwd = passwordInput.value;
        if(email === VALID_EMAIL && pwd === VALID_PASSWORD) {
            showGameAfterLogin(email);
        } else {
            loginError.innerText = '❌ Неверная почта или пароль';
        }
    };
    
    menuLogoutBtn.onclick = logout;
    gameExitBtn.onclick = () => {
        if(currentGame && typeof currentGame.destroy === 'function') currentGame.destroy();
        gameInitialized = false;
        showMenu();
    };
    playBtn.onclick = () => { showSearch(); };
    resultOkBtn.onclick = () => { showMenu(); };
    
    function afterSplash() {
        if (isLoggedIn && localStorage.getItem('cluns_user_email')) {
            currentUserEmail = localStorage.getItem('cluns_user_email');
            userEmailDisplay.innerText = currentUserEmail.split('@')[0];
            showMenu();
        } else {
            showLogin();
        }
    }
    
    setTimeout(() => {
        if (splashScreen && !splashScreen.classList.contains('hidden')) {
            splashScreen.style.opacity = '0';
            setTimeout(() => {
                splashScreen.classList.add('hidden');
                splashScreen.style.opacity = '';
                afterSplash();
            }, 500);
        }
    }, 6000);
</script>
</body>
</html>
