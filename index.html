<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cluns Fite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            padding: 16px;
        }
        
        /* СТАРТОВЫЙ ЭКРАН */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a1f 0%, #0a0f1e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .splash-content {
            text-align: center;
            animation: fadeInUp 1s ease;
        }
        .splash-title {
            font-size: 3rem;
            font-weight: bold;
            color: #ffcc44;
            text-shadow: 0 0 20px #ff6600;
            margin-bottom: 16px;
        }
        .splash-subtitle {
            font-size: 1rem;
            color: #ffaa66;
            margin-bottom: 30px;
        }
        .splash-company {
            font-size: 0.8rem;
            color: #88aaff;
            margin-top: 40px;
            border-top: 1px solid #ffaa33;
            display: inline-block;
            padding-top: 12px;
            padding-left: 20px;
            padding-right: 20px;
        }
        .splash-loader {
            width: 40px;
            height: 40px;
            margin: 20px auto 0;
            border: 3px solid #ffaa33;
            border-top-color: #ff4400;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ОБЩИЕ КОНТЕЙНЕРЫ */
        .login-container, .menu-container, .game-container, .search-container, .result-container, .fighters-container {
            background: #1a2a1f;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 3px solid #ffcc44;
            width: 360px;
            max-width: 95vw;
        }
        
        /* МЕНЮ БОЙЦОВ — С ПРОКРУТКОЙ (ГАРАНТИРОВАННО) */
        .fighters-container {
            max-height: 85vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: block;
        }
        .fighters-container::-webkit-scrollbar {
            width: 5px;
        }
        .fighters-container::-webkit-scrollbar-track {
            background: #2d3e2b;
            border-radius: 10px;
        }
        .fighters-container::-webkit-scrollbar-thumb {
            background: #ffaa33;
            border-radius: 10px;
        }
        
        h2, h3 {
            color: #ffec99;
            text-align: center;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2d3e2b;
            border: 2px solid #ffaa33;
            border-radius: 40px;
            color: #ffec99;
            font-family: monospace;
            font-size: 1rem;
            outline: none;
        }
        button {
            width: 100%;
            background: #5a3e1a;
            border: none;
            color: #ffdd99;
            font-family: monospace;
            font-weight: bold;
            padding: 12px;
            border-radius: 40px;
            font-size: 1.1rem;
            margin-top: 12px;
            box-shadow: 0 4px 0 #2a1e05;
            transition: 0.05s linear;
            cursor: pointer;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2a1e05;
        }
        .error {
            color: #ff8866;
            text-align: center;
            margin-top: 12px;
        }
        .hidden {
            display: none;
        }
        .stats {
            background: #000000aa;
            padding: 12px;
            border-radius: 20px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
        }
        .stat {
            text-align: center;
            color: #ffec99;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffaa33;
        }
        .arena-badge {
            background: #442200;
            padding: 8px;
            border-radius: 20px;
            text-align: center;
            margin: 12px 0;
            color: #ffcc88;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            background: #2d3e2b;
            box-shadow: inset 0 0 0 2px #ffcc88, 0 0 0 4px #442200;
            width: 100%;
            height: auto;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .panel {
            background: #000000aa;
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 60px;
            color: #ffec99;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #ffaa33;
        }
        .search-text {
            text-align: center;
            color: #ffcc88;
            font-size: 1rem;
            margin: 20px 0;
        }
        .timer {
            font-size: 2rem;
            text-align: center;
            color: #ffaa33;
        }
        .result-text {
            text-align: center;
            font-size: 1.3rem;
            margin: 20px 0;
        }
        .win-text { color: #88ff88; }
        .lose-text { color: #ff8888; }
        
        .fighter-card {
            background: #2d3e2b;
            border-radius: 20px;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #ffaa33;
            text-align: center;
        }
        .fighter-name {
            font-size: 1.3rem;
            color: #ffcc44;
            font-weight: bold;
        }
        .fighter-status {
            font-size: 0.9rem;
            margin-top: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .locked {
            background: #4a2a2a;
            color: #ff8888;
        }
        .unlocked {
            background: #2a4a2a;
            color: #88ff88;
        }
        .fighter-desc {
            margin-top: 8px;
            color: #ffcc99;
            font-size: 0.8rem;
        }
        .back-btn {
            background: #4a2a1a;
            margin-top: 8px;
        }
        .ability-badge {
            background: #2a2a4a;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 8px;
        }
        .select-btn {
            margin-top: 10px;
            padding: 8px;
            border-radius: 40px;
            font-size: 0.9rem;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="splashScreen" class="splash-screen">
    <div class="splash-content">
        <div class="splash-title">CLUNS FITE</div>
        <div class="splash-subtitle">⚔️ БИТВА КЛОУНОВ ⚔️</div>
        <div class="splash-loader"></div>
        <div class="splash-company">DlowHill</div>
    </div>
</div>

<div id="loginScreen" class="login-container hidden">
    <h2>🤡 CLUNS FITE</h2>
    <input type="text" id="emailInput" placeholder="Почта" autocomplete="off">
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button id="loginBtn">ВОЙТИ</button>
    <div id="loginError" class="error"></div>
</div>

<div id="menuScreen" class="menu-container hidden">
    <h2>🤡 CLUNS FITE</h2>
    <div class="stats">
        <div class="stat"><div>🏆 ПОБЕДЫ</div><div class="stat-value" id="winsValue">0</div></div>
        <div class="stat"><div>🎪 АРЕНА</div><div class="stat-value" id="arenaValue">1</div></div>
    </div>
    <div class="arena-badge" id="arenaName">⚔️ НАЧАЛЬНАЯ АРЕНА</div>
    <button id="playBtn">🔍 ИГРАТЬ</button>
    <button id="fightersBtn">🥊 БОЙЦЫ</button>
    <button id="menuLogoutBtn" style="background:#4a2a1a;">🚪 ВЫЙТИ</button>
</div>

<div id="fightersScreen" class="fighters-container hidden">
    <h2>🥊 БОЙЦЫ</h2>
    <div id="fightersList"></div>
    <button id="backToMenuBtn" class="back-btn">🏠 В МЕНЮ</button>
</div>

<div id="searchScreen" class="search-container hidden">
    <h3>🔍 ПОИСК</h3>
    <div class="search-text">Cluns Fite</div>
    <div class="timer" id="searchTimer">5</div>
    <div class="search-text">Ожидание...</div>
</div>

<div id="resultScreen" class="result-container hidden">
    <h2 id="resultTitle">РЕЗУЛЬТАТ</h2>
    <div class="result-text" id="resultMessage"></div>
    <button id="resultOkBtn">В МЕНЮ</button>
</div>

<div id="gameScreen" class="game-container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <div class="panel">👤 <span id="userEmailDisplay"></span></div>
        <button id="gameExitBtn" style="width:auto; padding:6px 12px; font-size:0.7rem;">🏠 МЕНЮ</button>
    </div>
    <canvas id="gameCanvas" width="360" height="480"></canvas>
    <div class="info">
        <div class="panel">❤️ ЖИЗНИ: <span id="hpValue">5</span></div>
        <div class="panel">🤡 СЧЁТ: <span id="scoreValue">0</span></div>
    </div>
    <div class="info">
        <div class="panel">🔫 ТЫКАЙ ПО ВРАГАМ</div>
        <div class="panel" id="fighterNameDisplay">🤡 КЛОУН</div>
    </div>
</div>

<script>
    // =====================================================
    // 100% РАБОЧАЯ ВЕРСИЯ
    // =====================================================
    
    // АВТОРИЗАЦИЯ (Base64 защита)
    const MAIN_EMAIL = atob("ZGxvd0BjbHVucy5jb20=");
    const MAIN_PASS = atob("Y2x1bnMxMjM=");
    
    // ДАННЫЕ
    let playerWins = 0;
    let playerArena = 1;
    let currentUserEmail = '';
    let currentGame = null;
    let gameInitialized = false;
    let searchInterval = null;
    let currentFighter = 'default';
    
    // ДОМ ЭЛЕМЕНТЫ
    const splashScreen = document.getElementById('splashScreen');
    const loginScreen = document.getElementById('loginScreen');
    const menuScreen = document.getElementById('menuScreen');
    const fightersScreen = document.getElementById('fightersScreen');
    const searchScreen = document.getElementById('searchScreen');
    const gameScreen = document.getElementById('gameScreen');
    const resultScreen = document.getElementById('resultScreen');
    
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const menuLogoutBtn = document.getElementById('menuLogoutBtn');
    const gameExitBtn = document.getElementById('gameExitBtn');
    const playBtn = document.getElementById('playBtn');
    const fightersBtn = document.getElementById('fightersBtn');
    const backToMenuBtn = document.getElementById('backToMenuBtn');
    const resultOkBtn = document.getElementById('resultOkBtn');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const winsSpan = document.getElementById('winsValue');
    const arenaSpan = document.getElementById('arenaValue');
    const arenaNameSpan = document.getElementById('arenaName');
    const searchTimerSpan = document.getElementById('searchTimer');
    const fighterNameDisplay = document.getElementById('fighterNameDisplay');
    const resultTitle = document.getElementById('resultTitle');
    const resultMessage = document.getElementById('resultMessage');
    
    // ФУНКЦИИ
    function isShlyukUnlocked() { return playerWins >= 500; }
    function isDusyaUnlocked() { return playerWins >= 50; }
    function getBonusWins() { return (currentFighter === 'dusya' && isDusyaUnlocked()) ? 1 : 0; }
    
    function updateArenaByWins() {
        if (playerWins >= 15) playerArena = 3;
        else if (playerWins >= 5) playerArena = 2;
        else playerArena = 1;
    }
    
    function updateMenuStats() {
        winsSpan.innerText = playerWins;
        arenaSpan.innerText = playerArena;
        if (playerArena === 1) arenaNameSpan.innerText = '⚔️ НАЧАЛЬНАЯ АРЕНА';
        else if (playerArena === 2) arenaNameSpan.innerText = '🎪 ЦИРКОВАЯ АРЕНА';
        else arenaNameSpan.innerText = '🤡 БЕЗУМНАЯ АРЕНА';
    }
    
    function addWin() {
        let add = (currentFighter === 'dusya' && isDusyaUnlocked()) ? 2 : 1;
        playerWins += add;
        updateArenaByWins();
        localStorage.setItem('cluns_wins', playerWins);
        localStorage.setItem('cluns_arena', playerArena);
        updateMenuStats();
        
        if (playerWins === 50) alert('🦆 ПОЗДРАВЛЯЮ! Разблокирована ДУСЯ! Заходи в "БОЙЦЫ"');
        if (playerWins === 500) alert('🔪 ПОЗДРАВЛЯЮ! Разблокирован ШЛЮК! Заходи в "БОЙЦЫ"');
    }
    
    function removeWin() {
        if (playerWins > 0) playerWins--;
        updateArenaByWins();
        localStorage.setItem('cluns_wins', playerWins);
        localStorage.setItem('cluns_arena', playerArena);
        updateMenuStats();
    }
    
    function renderFighters() {
        const container = document.getElementById('fightersList');
        if (!container) return;
        
        const shlyukOk = isShlyukUnlocked();
        const dusyaOk = isDusyaUnlocked();
        
        container.innerHTML = `
            <div class="fighter-card">
                <div class="fighter-name">🤡 ОБЫЧНЫЙ</div>
                <div class="fighter-status unlocked">✅ ДОСТУПЕН</div>
                <div class="fighter-desc">Стандартный боец</div>
                <button class="select-btn" id="selectDefaultBtn" style="background:#4a3e2a;">ВЫБРАТЬ</button>
            </div>
            <div class="fighter-card">
                <div class="fighter-name">🦆 ДУСЯ</div>
                <div class="fighter-status ${dusyaOk ? 'unlocked' : 'locked'}">${dusyaOk ? '✅ РАЗБЛОКИРОВАН' : '🔒 50 ПОБЕД'}</div>
                <div class="fighter-desc">+1 победа за матч</div>
                ${dusyaOk ? '<button class="select-btn" id="selectDusyaBtn" style="background:#2a5a4a;">ВЫБРАТЬ</button>' : '<div class="fighter-desc">⭐ Нужно 50 побед</div>'}
            </div>
            <div class="fighter-card">
                <div class="fighter-name">🔪 ШЛЮК</div>
                <div class="fighter-status ${shlyukOk ? 'unlocked' : 'locked'}">${shlyukOk ? '✅ РАЗБЛОКИРОВАН' : '🔒 500 ПОБЕД'}</div>
                <div class="fighter-desc">+3 жизни, +4 радиус</div>
                ${shlyukOk ? '<button class="select-btn" id="selectShlyukBtn" style="background:#6a2e5a;">ВЫБРАТЬ</button>' : '<div class="fighter-desc">⭐ Нужно 500 побед</div>'}
            </div>
            <div style="text-align:center; padding:8px; color:#ffaa66;">⭐ ТВОИ ПОБЕДЫ: ${playerWins}</div>
        `;
        
        document.getElementById('selectDefaultBtn')?.addEventListener('click', () => {
            currentFighter = 'default';
            localStorage.setItem('cluns_fighter', 'default');
            fighterNameDisplay.innerText = '🤡 КЛОУН';
            renderFighters();
        });
        document.getElementById('selectDusyaBtn')?.addEventListener('click', () => {
            if (isDusyaUnlocked()) {
                currentFighter = 'dusya';
                localStorage.setItem('cluns_fighter', 'dusya');
                fighterNameDisplay.innerText = '🦆 ДУСЯ (+1 победа)';
                renderFighters();
            }
        });
        document.getElementById('selectShlyukBtn')?.addEventListener('click', () => {
            if (isShlyukUnlocked()) {
                currentFighter = 'shlyuk';
                localStorage.setItem('cluns_fighter', 'shlyuk');
                fighterNameDisplay.innerText = '🔪 ШЛЮК';
                renderFighters();
            }
        });
    }
    
    function showFighters() {
        renderFighters();
        menuScreen.classList.add('hidden');
        fightersScreen.classList.remove('hidden');
    }
    
    function showLogin() {
        loginScreen.classList.remove('hidden');
        menuScreen.classList.add('hidden');
        fightersScreen.classList.add('hidden');
        searchScreen.classList.add('hidden');
        gameScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        if (searchInterval) clearInterval(searchInterval);
        emailInput.value = '';
        passwordInput.value = '';
        loginError.innerText = '';
    }
    
    function showMenu() {
        if (currentGame && currentGame.destroy) currentGame.destroy();
        gameInitialized = false;
        loginScreen.classList.add('hidden');
        fightersScreen.classList.add('hidden');
        searchScreen.classList.add('hidden');
        gameScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
        updateMenuStats();
        if (searchInterval) clearInterval(searchInterval);
        
        if (currentFighter === 'shlyuk' && isShlyukUnlocked()) fighterNameDisplay.innerText = '🔪 ШЛЮК';
        else if (currentFighter === 'dusya' && isDusyaUnlocked()) fighterNameDisplay.innerText = '🦆 ДУСЯ (+1 победа)';
        else fighterNameDisplay.innerText = '🤡 КЛОУН';
    }
    
    function showSearch() {
        menuScreen.classList.add('hidden');
        searchScreen.classList.remove('hidden');
        let timer = 5;
        searchTimerSpan.innerText = timer;
        if (searchInterval) clearInterval(searchInterval);
        searchInterval = setInterval(() => {
            timer--;
            searchTimerSpan.innerText = timer;
            if (timer <= 0) {
                clearInterval(searchInterval);
                searchInterval = null;
                startGame();
            }
        }, 1000);
    }
    
    function startGame() {
        searchScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        if (!gameInitialized) initGameSystem();
        else if (currentGame && currentGame.reset) currentGame.reset();
    }
    
    function showResult(isWin) {
        if (currentGame && currentGame.destroy) currentGame.destroy();
        gameInitialized = false;
        gameScreen.classList.add('hidden');
        
        if (isWin) {
            addWin();
            resultTitle.innerText = '🏆 ПОБЕДА!';
            resultMessage.innerText = getBonusWins() ? '+1 ПОБЕДА (+1 от ДУСИ)' : '+1 ПОБЕДА';
            resultMessage.className = 'result-text win-text';
        } else {
            removeWin();
            resultTitle.innerText = '💀 ПОРАЖЕНИЕ';
            resultMessage.innerText = '-1 ПОБЕДА';
            resultMessage.className = 'result-text lose-text';
        }
        resultScreen.classList.remove('hidden');
    }
    
    function logout() {
        localStorage.clear();
        playerWins = 0;
        playerArena = 1;
        currentFighter = 'default';
        showLogin();
    }
    
    // ИГРА
    function initGameSystem() {
        gameInitialized = true;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.widthcurrentF = 360;
        canvas.height = 480;
        const CW = 360, CH = 480;
        
        const isShlyuk = (ighter === 'shlyuk' && isShlyukUnlocked());
        const isDusya = (currentFighter === 'dusya' && isDusyaUnlocked());
        const bonusHp = isShlyuk ? 3 : 0;
        const bonusRadius = isShlyuk ? 4 : (isDusya ? 2 : 0);
        const color = isShlyuk ? '#ff44aa' : (isDusya ? '#44ffaa' : '#ff77dd');
        
        let player = { x: CW/2, y: CH-70, radius: 18 + bonusRadius, hp: 5 + bonusHp, invincible: 0 };
        let score = 0, gameOver = false, enemies = [], spawnCounter = 0;
        let mouseX = player.x, mouseY = player.y;
        let animId = null;
        
        function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
        function spawnEnemy() {
            if (gameOver) return;
            let r = 10 + Math.random() * 6;
            enemies.push({ x: 20 + Math.random() * (CW-40), y: -r, radius: r, speed: 0.5 + Math.random(), hp: 1, color: `hsl(${Math.random()*60+20},70%,55%)` });
        }
        
        function update() {
            if (gameOver) return;
            player.x = clamp(mouseX, player.radius+5, CW-player.radius-5);
            player.y = clamp(mouseY, player.radius+20, CH-player.radius-10);
            if (player.invincible > 0) player.invincible--;
            for (let e of enemies) {
                e.y += e.speed;
                let d = Math.hypot(player.x - e.x, player.y - e.y);
                if (d < player.radius + e.radius && player.invincible === 0 && !gameOver) {
                    player.hp--;
                    player.invincible = 15;
                    if (player.hp <= 0) gameOver = true;
                }
            }
            enemies = enemies.filter(e => e.y + e.radius < CH + 50 && e.y + e.radius > -50);
            spawnCounter++;
            if (spawnCounter >= 35 && !gameOver) {
                spawnCounter = 0;
                for (let i = 0; i < 1 + Math.floor(Math.random() * 2); i++) spawnEnemy();
            }
            if (score > 30 && Math.random() < 0.01 && !gameOver) spawnEnemy();
        }
        
        function handleTap(e) {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            let x, y;
            if (e.touches) { x = (e.touches[0].clientX - rect.left) * sx; y = (e.touches[0].clientY - rect.top) * sy; e.preventDefault(); }
            else { x = (e.clientX - rect.left) * sx; y = (e.clientY - rect.top) * sy; }
            for (let i = enemies.length-1; i >= 0; i--) {
                if (Math.hypot(x - enemies[i].x, y - enemies[i].y) < enemies[i].radius + 15) {
                    enemies.splice(i,1);
                    score += 10;
                    break;
                }
            }
        }
        
        function move(e) {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; e.preventDefault(); }
            else { cx = e.clientX; cy = e.clientY; }
            mouseX = clamp((cx - rect.left) * sx, 8, CW-8);
            mouseY = clamp((cy - rect.top) * sy, 40, CH-20);
        }
        
        function checkWin() { if (score >= 50 && !gameOver) { gameOver = true; showResult(true); } }
        
        function reset() {
            gameOver = false;
            const nowShlyuk = (currentFighter === 'shlyuk' && isShlyukUnlocked());
            const nowDusya = (currentFighter === 'dusya' && isDusyaUnlocked());
            player.radius = 18 + (nowShlyuk ? 4 : (nowDusya ? 2 : 0));
            player.hp = 5 + (nowShlyuk ? 3 : 0);
            player.invincible = 0;
            score = 0;
            enemies = [];
            player.x = CW/2;
            player.y = CH-70;
            mouseX = player.x;
            mouseY = player.y;
            spawnCounter = 5;
            for(let i=0;i<1;i++) spawnEnemy();
        }
        
        function draw() {
            ctx.clearRect(0,0,CW,CH);
            ctx.fillStyle = "#4a8c3f";
            ctx.fillRect(0,0,CW,CH);
            for(let i=0;i<40;i++) { ctx.fillStyle = `rgba(255,220,100,${Math.random()*0.2})`; ctx.fillRect(Math.random()*CW, Math.random()*CH, 3+Math.random()*6, 3+Math.random()*6); }
            for(let e of enemies) {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
                ctx.fillStyle = e.color;
                ctx.fill();
                ctx.fillStyle = "#FFF";
                ctx.beginPath();
                ctx.arc(e.x-4, e.y-4, 3, 0, Math.PI*2);
                ctx.arc(e.x+4, e.y-4, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(e.x-4, e.y-5, 1.5, 0, Math.PI*2);
                ctx.arc(e.x+4, e.y-5, 1.5, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x, e.y+4, 6, 0.05, Math.PI-0.05);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(player.x-6, player.y-4, 4, 0, Math.PI*2);
            ctx.arc(player.x+6, player.y-4, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#310";
            ctx.beginPath();
            ctx.arc(player.x-6, player.y-5, 2, 0, Math.PI*2);
            ctx.arc(player.x+6, player.y-5, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(player.x, player.y+2, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.font = "bold 12px monospace";
            ctx.fillStyle = "#FFDD88";
            ctx.fillText("ЦЕЛЬ: 50", CW-60, 20);
            if (player.hp <= 0 && !gameOver) gameOver = true;
            if (gameOver && player.hp <= 0) showResult(false);
            document.getElementById('hpValue').innerText = player.hp;
            document.getElementById('scoreValue').innerText = score;
            checkWin();
        }
        
        function loop() { update(); draw(); animId = requestAnimationFrame(loop); }
        
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('touchmove', move, {passive:false});
        canvas.addEventListener('touchstart', (e) => { move(e); handleTap(e); e.preventDefault(); });
        canvas.addEventListener('mousedown', handleTap);
        
        reset();
        loop();
        currentGame = { destroy: () => { cancelAnimationFrame(animId); }, reset: reset };
    }
    
    // ЗАГРУЗКА СОХРАНЕНИЙ
    let savedWins = localStorage.getItem('cluns_wins');
    let savedArena = localStorage.getItem('cluns_arena');
    let savedFighter = localStorage.getItem('cluns_fighter');
    if (savedWins) playerWins = parseInt(savedWins);
    if (savedArena) playerArena = parseInt(savedArena);
    if (savedFighter) currentFighter = savedFighter;
    updateArenaByWins();
    
    function afterSplash() {
        if (localStorage.getItem('cluns_logged_in') === 'true' && localStorage.getItem('cluns_user_email')) {
            currentUserEmail = localStorage.getItem('cluns_user_email');
            userEmailDisplay.innerText = currentUserEmail.split('@')[0];
            showMenu();
        } else showLogin();
    }
    
    loginBtn.onclick = () => {
        let email = emailInput.value.trim();
        let pwd = passwordInput.value;
        if (email === MAIN_EMAIL && pwd === MAIN_PASS) {
            currentUserEmail = email;
            localStorage.setItem('cluns_logged_in', 'true');
            localStorage.setItem('cluns_user_email', email);
            userEmailDisplay.innerText = email.split('@')[0];
            showMenu();
        } else loginError.innerText = '❌ Неверная почта или пароль';
    };
    
    menuLogoutBtn.onclick = logout;
    gameExitBtn.onclick = () => { if(currentGame && currentGame.destroy) currentGame.destroy(); gameInitialized = false; showMenu(); };
    playBtn.onclick = showSearch;
    fightersBtn.onclick = showFighters;
    backToMenuBtn.onclick = () => { menuScreen.classList.remove('hidden'); fightersScreen.classList.add('hidden'); };
    resultOkBtn.onclick = () => { resultScreen.classList.add('hidden'); showMenu(); };
    
    setTimeout(() => {
        if (splashScreen) {
            splashScreen.style.opacity = '0';
            setTimeout(() => {
                splashScreen.classList.add('hidden');
                afterSplash();
            }, 500);
        }
    }, 4000);
</script>
</body>
</html>
